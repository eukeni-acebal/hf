     role="img" aria-label="Creative Commons BY-SA 4.0">
  <rect x="0.5" y="0.5" width="87" height="30" rx="3" fill="none" stroke="#2b241a" stroke-width="1"/>
  <text x="44" y="13.5" text-anchor="middle" font-family="Source Sans 3, system-ui, sans-serif"
        font-size="10" font-weight="700" letter-spacing="0.5" fill="#2b241a">CC BY-SA</text>
