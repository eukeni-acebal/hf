  DISTINTIVO DE LICENCIA · CC BY-SA 4.0
  ============================================================
  PROVISIONAL. Este fichero es un rótulo tipográfico escrito a mano, con las
  proporciones del distintivo oficial (88 × 31) y la paleta Areté, para que la
  portada nunca enseñe una imagen rota. NO es el distintivo oficial de Creative
